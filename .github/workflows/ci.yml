name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint & format check (Biome)
        run: npm run ci

      - name: Type-check
        run: npm run typecheck

      - name: Exercise checks
        run: |
          node lib/exercises/generators/english.check.mjs
          node lib/exercises/generators/english-quiz.check.mjs
          node lib/exercises/generators/french.check.mjs
          node lib/exercises/generators/history.check.mjs

      - name: Build
        run: npm run build
